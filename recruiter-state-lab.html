<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>LuxRoom — Senior Commerce State Lab</title>
  <style>
    :root{color-scheme:light;--ink:#171713;--muted:#746f66;--line:#d8d1c5;--paper:#f3efe6}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}.bar{min-height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 18px;position:relative;z-index:20}.wordmark{min-width:220px}.wordmark strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:16px}.wordmark span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;margin-top:4px}.states{display:flex;gap:5px;flex:1;overflow-x:auto}.state,.utility{appearance:none;border:1px solid #bbb4a8;background:#fff;color:#171713;padding:9px 11px;font:600 9px/1 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}.state[aria-pressed="true"]{background:#171713;color:#fff;border-color:#171713}.status{min-width:230px;text-align:right;font-size:9px;line-height:1.35;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.wrap{height:calc(100% - 72px);position:relative}.frame{width:100%;height:100%;border:0;display:block;background:#fff}.note{position:absolute;right:14px;bottom:14px;background:rgba(23,23,19,.94);color:#fff;padding:8px 10px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;z-index:10;pointer-events:none}@media(max-width:900px){.bar{flex-wrap:wrap;padding:9px 10px}.wordmark{min-width:165px}.status{display:none}.states{order:3;flex-basis:100%}.wrap{height:calc(100% - 112px)}}
  </style>
</head>
<body>
<header class="bar">
  <div class="wordmark"><strong>LuxRoom</strong><span>Senior commerce state lab · decision + recovery</span></div>
  <div class="states" role="group" aria-label="Choose prototype state">
    <button class="state" data-state="normal" aria-pressed="false">Normal</button>
    <button class="state" data-state="empty" aria-pressed="false">Empty Cart</button>
    <button class="state" data-state="loading" aria-pressed="false">Media Loading</button>
    <button class="state" data-state="error" aria-pressed="false">Checkout Error</button>
    <button class="state" data-state="edge" aria-pressed="false">Made-to-order Edge</button>
  </div>
  <div class="status" id="status">Ready</div>
  <button class="utility" id="copy" type="button">Copy state link</button>
</header>
<div class="wrap"><iframe id="frame" class="frame" title="LuxRoom commerce prototype"></iframe><div class="note">Forced review state · no live payment or fulfilment</div></div>
<script>
(() => {
  const frame=document.getElementById('frame');
  const status=document.getElementById('status');
  const buttons=[...document.querySelectorAll('[data-state]')];
  const routes={normal:'detail.html?product=1',empty:'cart.html',loading:'detail.html?product=1',error:'checkout.html',edge:'detail.html?product=2'};
  const labels={normal:'PDP decision confidence',empty:'Cart recovery / first-use state',loading:'Product media loading',error:'Checkout validation / recovery',edge:'Made-to-order / long lead-time edge'};
  let active='normal';
  function addStyle(doc,key,css){if(doc.querySelector(`style[data-lux-state="${key}"]`))return;const style=doc.createElement('style');style.dataset.luxState=key;style.textContent=css;doc.head.appendChild(style)}
  function setState(next,updateUrl=true){if(!routes[next])next='normal';active=next;buttons.forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.state===next)));status.textContent=labels[next];if(updateUrl){const url=new URL(location.href);url.searchParams.set('state',next);history.replaceState({},'',url)}frame.src=routes[next]+(routes[next].includes('?')?'&':'?')+'lab=1'}
  function emptyState(doc){
    const list=doc.querySelector('#cart-items-container'); if(!list)return;
    list.innerHTML='<section class="cart-empty senior-lab-empty" data-state-lab-marker="empty"><span>SELECTION / 00</span><strong>Your room starts with one considered object.</strong><p>No items are in this review state. Return to the collection, compare fit and arrival, then add only what earns a place.</p><a href="products.html">Explore the collection ↗</a></section>';
    doc.querySelectorAll('[data-cart-count]').forEach(node=>{node.textContent='0';node.style.display='none'});
    const checkout=doc.querySelector('.btn-checkout');if(checkout){checkout.removeAttribute('href');checkout.setAttribute('aria-disabled','true');checkout.tabIndex=-1}
    addStyle(doc,'empty','.senior-lab-empty{min-height:340px;display:grid;align-content:center;gap:14px;border-top:1px solid #171713;border-bottom:1px solid #d8d1c5;padding:50px 0}.senior-lab-empty span{font-size:10px;letter-spacing:.13em}.senior-lab-empty strong{font-family:Georgia,serif;font-size:clamp(32px,4vw,58px);font-weight:400;max-width:760px}.senior-lab-empty p{max-width:600px;line-height:1.55;color:#6d685f}.senior-lab-empty a{color:inherit;text-underline-offset:4px}')
  }
  function loadingState(doc){
    const gallery=doc.querySelector('.d-gallery');if(!gallery)return;gallery.setAttribute('data-state-lab-marker','loading');if(!gallery.querySelector('.lux-loading-note'))gallery.insertAdjacentHTML('beforeend','<div class="lux-loading-note" role="status">Loading room-scale imagery · decision content remains available</div>');
    addStyle(doc,'loading','@keyframes luxload{0%{transform:translateX(-120%)}100%{transform:translateX(240%)}}.d-gallery{position:relative;overflow:hidden}.d-gallery>*:not(.lux-loading-note){filter:blur(10px);opacity:.45}.d-gallery:after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:luxload 1.1s ease-in-out infinite}.lux-loading-note{position:absolute;left:18px;bottom:18px;z-index:4;background:#fff;border:1px solid #cbc4b9;padding:9px 11px;font-size:9px;text-transform:uppercase;letter-spacing:.1em}@media(prefers-reduced-motion:reduce){.d-gallery:after{animation:none}}')
  }
  function errorState(doc){
    const intro=doc.querySelector('.checkout-intro');if(!intro)return;
    if(!doc.querySelector('.lux-checkout-error-state'))intro.insertAdjacentHTML('afterend','<section class="lux-checkout-error-state" data-state-lab-marker="error" role="alert"><span>CHECKOUT / RECOVERY</span><h2>We could not record the order.</h2><p>Your Bag and checkout draft are preserved on this device. No payment was attempted. Review the highlighted details or return to the Bag without losing the selection.</p><div><button type="button">Review details</button><a href="cart.html">Return to cart</a></div></section>');
    addStyle(doc,'error','.lux-checkout-error-state{border-top:1px solid #171713;border-bottom:1px solid #171713;padding:26px 0;margin:0 0 34px}.lux-checkout-error-state span{font-size:9px;letter-spacing:.13em}.lux-checkout-error-state h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(30px,4vw,48px);margin:10px 0}.lux-checkout-error-state p{max-width:760px;line-height:1.55;color:#635e55}.lux-checkout-error-state div{display:flex;gap:8px;flex-wrap:wrap}.lux-checkout-error-state button,.lux-checkout-error-state a{border:1px solid #171713;background:#fff;color:#171713;padding:10px 12px;text-decoration:none;text-transform:uppercase;font-size:9px;letter-spacing:.08em}.lux-checkout-error-state button{background:#171713;color:#fff}')
  }
  function edgeState(doc){
    const info=doc.querySelector('.d-info');if(!info)return;
    let edge=doc.querySelector('.lux-edge-note');if(!edge){edge=doc.createElement('section');edge.className='lux-edge-note';edge.dataset.stateLabMarker='edge';edge.setAttribute('role','status');edge.innerHTML='<span>MADE TO ORDER / DECISION EDGE</span><strong>Long lead time, access planning and return eligibility need confirmation.</strong><p>This state keeps uncertainty visible instead of presenting zero stock as an ordinary in-stock item. The customer can continue only after understanding timing and service constraints.</p>';info.querySelector('.decision-facts')?.insertAdjacentElement('afterend',edge)}
    const stock=doc.querySelector('#detail-stock-summary');if(stock)stock.textContent='Made to order';const availability=doc.querySelector('#detail-availability');if(availability)availability.textContent='Made to order · production lead time applies';
    addStyle(doc,'edge','.lux-edge-note{margin:18px 0;padding:16px;border:1px solid #8c806d;background:#f5efe3}.lux-edge-note span{font-size:9px;letter-spacing:.12em}.lux-edge-note strong{display:block;margin:8px 0;font-size:14px;line-height:1.35}.lux-edge-note p{margin:0;line-height:1.5;color:#675f54;font-size:11px}')
  }
  function apply(){const doc=frame.contentDocument;if(!doc)return;if(active==='empty')emptyState(doc);if(active==='loading')loadingState(doc);if(active==='error')errorState(doc);if(active==='edge')edgeState(doc)}
  frame.addEventListener('load',()=>[0,220,700].forEach(delay=>setTimeout(apply,delay)));
  buttons.forEach(btn=>btn.addEventListener('click',()=>setState(btn.dataset.state)));
  document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);status.textContent='State link copied'}catch{status.textContent='Copy unavailable'}});
  setState(new URL(location.href).searchParams.get('state')||'normal',false);
})();
</script>
</body>
</html>
